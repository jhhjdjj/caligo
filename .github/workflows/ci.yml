name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the test suite
        run: npm test
      - name: Check generated files are up to date
        if: matrix.node == 22
        run: |
          node scripts/build-examples.js
          node scripts/gen-builtins-doc.js
          git diff --exit-code -- web/examples.js docs/builtins.md
      - name: Smoke test the CLI
        if: matrix.node == 22
        run: |
          node bin/caligo.js eval "sum(range(10))"
          node bin/caligo.js run examples/fizzbuzz.caligo > /dev/null
